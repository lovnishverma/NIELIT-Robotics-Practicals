<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0b1120;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="icBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="termBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="480" y="30" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">L293D Motor Driver Shield Wiring (Practicals 3.1 to 3.6)</text>
  <text x="480" y="48" fill="#94a3b8" font-size="12" text-anchor="middle">Arduino UNO + L293D Shield (Left Motor → M1, Right Motor → M2, Bluetooth → A0/A1)</text>

  <!-- LEFT MOTOR BOX (Top Left) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="90" y="28" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">LEFT DC MOTOR</text>
    <text x="90" y="46" fill="#94a3b8" font-size="11" text-anchor="middle">Yellow BO Gear Motor</text>
    
    <circle cx="165" cy="62" r="5" fill="#ef4444"/><text x="150" y="66" fill="#ef4444" font-size="11" font-weight="bold">M+</text>
    <circle cx="165" cy="82" r="5" fill="#000000" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="86" fill="#94a3b8" font-size="11" font-weight="bold">M−</text>
  </g>

  <!-- RIGHT MOTOR BOX (Middle Left) -->
  <g transform="translate(30, 200)">
    <rect x="0" y="0" width="180" height="95" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="90" y="28" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">RIGHT DC MOTOR</text>
    <text x="90" y="46" fill="#94a3b8" font-size="11" text-anchor="middle">Yellow BO Gear Motor</text>
    
    <circle cx="165" cy="62" r="5" fill="#ef4444"/><text x="150" y="66" fill="#ef4444" font-size="11" font-weight="bold">M+</text>
    <circle cx="165" cy="82" r="5" fill="#000000" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="86" fill="#94a3b8" font-size="11" font-weight="bold">M−</text>
  </g>

  <!-- BATTERY PACK BOX (Bottom Left) -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="180" height="125" rx="8" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="90" y="28" fill="#fdf2f8" font-size="13" font-weight="bold" text-anchor="middle">2x 18650 Li-ion</text>
    <text x="90" y="46" fill="#fbcfe8" font-size="11" text-anchor="middle">7.4V Battery Pack</text>
    <text x="90" y="64" fill="#93c5fd" font-size="10" text-anchor="middle">with Power Switch</text>
    
    <circle cx="165" cy="88" r="5" fill="#ef4444"/><text x="150" y="92" fill="#ef4444" font-size="11" font-weight="bold">(+)</text>
    <circle cx="165" cy="108" r="5" fill="#000000" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="112" fill="#94a3b8" font-size="11" font-weight="bold">(−)</text>
  </g>

  <!-- BLUETOOTH HC-05 BOX (Right Side) -->
  <g transform="translate(710, 300)">
    <rect x="0" y="0" width="220" height="185" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="26" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">HC-05 BLUETOOTH</text>
    <text x="110" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">(Practical 3.6 Teleoperation)</text>
    
    <circle cx="20" cy="75" r="5" fill="#ef4444"/><text x="35" y="79" fill="#ef4444" font-size="11" font-weight="bold">VCC (5V)</text>
    <circle cx="20" cy="105" r="5" fill="#94a3b8"/><text x="35" y="109" fill="#94a3b8" font-size="11" font-weight="bold">GND (0V)</text>
    <circle cx="20" cy="135" r="5" fill="#38bdf8"/><text x="35" y="139" fill="#38bdf8" font-size="11" font-weight="bold">TXD → A0 (RX)</text>
    <circle cx="20" cy="165" r="5" fill="#a855f7"/><text x="35" y="169" fill="#a855f7" font-size="11" font-weight="bold">RXD → 1k/2k → A1 (TX)</text>
  </g>

  <!-- ================= CENTRAL L293D SHIELD ================= -->
  <g transform="translate(260, 65)">
    <!-- Blue PCB Board -->
    <rect x="0" y="0" width="410" height="440" rx="16" fill="url(#shieldBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="205" y="26" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">L293D MOTOR DRIVER SHIELD</text>

    <!-- Arduino Digital Header Top -->
    <rect x="35" y="38" width="340" height="15" rx="3" fill="#0f172a"/>
    <text x="205" y="49" fill="#64748b" font-size="9" text-anchor="middle">ARDUINO DIGITAL HEADER (D0 to D13)</text>

    <!-- LEFT SCREW TERMINAL BLOCK (M1 & M2: 5 Screws) -->
    <rect x="-18" y="70" width="42" height="175" rx="5" fill="url(#termBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- M1 (Top 2 Screws) -->
    <circle cx="3" cy="90" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="3" cy="115" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="32" y="106" fill="#fbbf24" font-size="13" font-weight="bold">M1</text>

    <!-- GND (Middle Screw) -->
    <circle cx="3" cy="145" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="32" y="149" fill="#94a3b8" font-size="9">GND</text>

    <!-- M2 (Bottom 2 Screws) -->
    <circle cx="3" cy="175" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="3" cy="200" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="32" y="191" fill="#fbbf24" font-size="13" font-weight="bold">M2</text>

    <!-- RIGHT SCREW TERMINAL BLOCK (M3 & M4) -->
    <rect x="386" y="70" width="42" height="175" rx="5" fill="url(#termBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="407" cy="90" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="407" cy="115" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="375" y="106" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="end">M3</text>
    <circle cx="407" cy="145" r="4" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="407" cy="175" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="407" cy="200" r="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="375" y="191" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="end">M4</text>

    <!-- IC Chips on Board -->
    <!-- IC1 L293D -->
    <rect x="75" y="90" width="55" height="130" rx="5" fill="url(#icBlack)" stroke="#64748b" stroke-width="1.5"/>
    <text x="102" y="160" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 102 160)">L293D (IC1)</text>

    <!-- IC3 74HC595 -->
    <rect x="175" y="105" width="55" height="110" rx="5" fill="url(#icBlack)" stroke="#64748b" stroke-width="1.5"/>
    <text x="202" y="165" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 202 165)">74HC595 (IC3)</text>

    <!-- IC2 L293D -->
    <rect x="275" y="90" width="55" height="130" rx="5" fill="url(#icBlack)" stroke="#64748b" stroke-width="1.5"/>
    <text x="302" y="160" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 302 160)">L293D (IC2)</text>

    <!-- EXT_PWR Screw Terminal (Bottom Left) -->
    <rect x="25" y="345" width="90" height="65" rx="5" fill="url(#termBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="362" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">EXT_PWR</text>
    
    <!-- Left Screw: +M -->
    <circle cx="50" cy="385" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="50" y="402" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">+M</text>
    
    <!-- Right Screw: GND -->
    <circle cx="90" cy="385" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="90" y="402" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle">GND</text>

    <!-- PWR Jumper -->
    <rect x="145" y="365" width="36" height="26" rx="4" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="163" y="356" fill="#86efac" font-size="10" font-weight="bold" text-anchor="middle">PWR</text>
    <text x="163" y="382" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">ON</text>

    <!-- Analog Breakout Header (Bottom Right) -->
    <rect x="245" y="345" width="150" height="75" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="320" y="362" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Analog Header (A0 - A5)</text>
    
    <!-- 4 Dedicated Pin Columns: 5V, GND, A0, A1 -->
    <g transform="translate(265, 385)">
      <text x="0" y="-3" fill="#ef4444" font-size="9" font-weight="bold" text-anchor="middle">5V</text>
      <circle cx="0" cy="8" r="5" fill="#ef4444"/>

      <text x="35" y="-3" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">GND</text>
      <circle cx="35" cy="8" r="5" fill="#94a3b8"/>

      <text x="70" y="-3" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">A0</text>
      <circle cx="70" cy="8" r="5" fill="#38bdf8"/>

      <text x="105" y="-3" fill="#a855f7" font-size="9" font-weight="bold" text-anchor="middle">A1</text>
      <circle cx="105" cy="8" r="5" fill="#a855f7"/>
    </g>
  </g>

  <!-- ================= ACCURATE ELECTRICAL CONNECTIONS ================= -->

  <!-- 1. Left Motor Wires -> M1 Terminals (Top 2 screws) -->
  <path d="M 195 137 H 230 V 155 H 263" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="263" cy="155" r="3.5" fill="#ef4444"/>

  <path d="M 195 157 H 220 V 180 H 263" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="263" cy="180" r="3.5" fill="#000000"/>

  <!-- 2. Right Motor Wires -> M2 Terminals (Bottom 2 screws) -->
  <path d="M 195 262 H 230 V 240 H 263" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="263" cy="240" r="3.5" fill="#ef4444"/>

  <path d="M 195 282 H 220 V 265 H 263" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="263" cy="265" r="3.5" fill="#000000"/>

  <!-- 3. Battery Wires -> EXT_PWR Terminals (Separate +M and GND screws) -->
  <!-- (+) Red -> +M (x=310, y=450) -->
  <path d="M 195 448 H 250 V 450 H 310" fill="none" stroke="#ef4444" stroke-width="3"/>
  <circle cx="195" cy="448" r="4" fill="#ef4444"/>
  <circle cx="310" cy="450" r="4" fill="#ef4444"/>

  <!-- (-) Black -> GND (x=350, y=450) -->
  <path d="M 195 468 H 240 V 470 H 350 V 450" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="195" cy="468" r="4" fill="#000000"/>
  <circle cx="350" cy="450" r="4" fill="#000000"/>

  <!-- 4. Bluetooth Wires -> Analog Header (Clean Routing Under Box) -->
  <!-- VCC -> 5V (x=525, y=458) -->
  <path d="M 710 375 H 680 V 470 H 525 V 458" fill="none" stroke="#ef4444" stroke-width="2"/>
  <circle cx="525" cy="458" r="3.5" fill="#ef4444"/>

  <!-- GND -> GND (x=560, y=458) -->
  <path d="M 710 405 H 670 V 478 H 560 V 458" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="560" cy="458" r="3.5" fill="#94a3b8"/>

  <!-- TXD -> A0 (x=595, y=458) -->
  <path d="M 710 435 H 660 V 486 H 595 V 458" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="595" cy="458" r="3.5" fill="#38bdf8"/>

  <!-- RXD -> A1 (x=630, y=458) -->
  <path d="M 710 465 H 650 V 494 H 630 V 458" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="630" cy="458" r="3.5" fill="#a855f7"/>
</svg>
