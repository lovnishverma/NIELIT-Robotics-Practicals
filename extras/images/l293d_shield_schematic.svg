<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="icGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="420" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">L293D Motor Driver Shield Wiring (Practicals 3.1 to 3.6)</text>
  <text x="420" y="52" fill="#94a3b8" font-size="13" text-anchor="middle">Arduino UNO + L293D Shield (M1 = Left Motor, M2 = Right Motor, A0/A1 = Bluetooth)</text>

  <!-- L293D Shield Board -->
  <g transform="translate(190, 75)">
    <!-- Blue PCB -->
    <rect x="0" y="0" width="380" height="420" rx="16" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="190" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L293D MOTOR DRIVER SHIELD</text>

    <!-- IC1 L293D (Left) -->
    <rect x="50" y="110" width="55" height="120" rx="4" fill="url(#icGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="77" cy="120" r="3" fill="#64748b"/>
    <text x="77" y="175" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 77 175)">L293D (IC1)</text>

    <!-- IC2 L293D (Right) -->
    <rect x="275" y="110" width="55" height="120" rx="4" fill="url(#icGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="302" cy="120" r="3" fill="#64748b"/>
    <text x="302" y="175" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90 302 175)">L293D (IC2)</text>

    <!-- IC3 74HC595 (Middle Shift Register) -->
    <rect x="162" y="125" width="55" height="100" rx="4" fill="url(#icGrad)" stroke="#475569" stroke-width="1.5"/>
    <text x="190" y="180" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 190 180)">74HC595 (IC3)</text>

    <!-- Screw Terminal M1 (Top Left) -->
    <rect x="10" y="50" width="35" height="75" rx="4" fill="url(#terminalGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="27" cy="68" r="5" fill="#e2e8f0"/>
    <circle cx="27" cy="102" r="5" fill="#e2e8f0"/>
    <text x="27" y="88" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">M1</text>

    <!-- Screw Terminal M2 (Top Right) -->
    <rect x="335" y="50" width="35" height="75" rx="4" fill="url(#terminalGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="352" cy="68" r="5" fill="#e2e8f0"/>
    <circle cx="352" cy="102" r="5" fill="#e2e8f0"/>
    <text x="352" y="88" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">M2</text>

    <!-- EXT_PWR Screw Terminal (Bottom Left) -->
    <rect x="25" y="345" width="70" height="50" rx="4" fill="url(#terminalGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="45" cy="370" r="5" fill="#e2e8f0"/>
    <circle cx="75" cy="370" r="5" fill="#e2e8f0"/>
    <text x="45" y="358" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">+M</text>
    <text x="75" y="358" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">GND</text>
    <text x="60" y="388" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">EXT_PWR</text>

    <!-- PWR Jumper -->
    <rect x="135" y="355" width="30" height="20" rx="3" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="150" y="348" fill="#86efac" font-size="10" font-weight="bold" text-anchor="middle">PWR Jumper</text>
    <text x="150" y="369" fill="#ffffff" font-size="8" text-anchor="middle">ON</text>

    <!-- Analog Breakout Header (Bottom Right) -->
    <rect x="240" y="335" width="125" height="65" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="302" y="350" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Analog Header (A0 - A5)</text>
    
    <!-- Pins Row: 5V, GND, A0, A1 -->
    <circle cx="255" cy="370" r="4" fill="#ef4444"/><text x="255" y="392" fill="#ef4444" font-size="9" text-anchor="middle">5V</text>
    <circle cx="280" cy="370" r="4" fill="#94a3b8"/><text x="280" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">GND</text>
    <circle cx="308" cy="370" r="4" fill="#38bdf8"/><text x="308" y="392" fill="#38bdf8" font-size="9" text-anchor="middle">A0</text>
    <circle cx="335" cy="370" r="4" fill="#a855f7"/><text x="335" y="392" fill="#a855f7" font-size="9" text-anchor="middle">A1</text>
  </g>

  <!-- LEFT MOTOR -->
  <g transform="translate(15, 115)">
    <rect x="0" y="10" width="130" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="35" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">LEFT DC MOTOR</text>
    <text x="65" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">(Yellow BO Gear Motor)</text>
    <!-- Wire to M1 -->
    <path d="M 130 35 L 200 130" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 130 55 L 200 160" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- RIGHT MOTOR -->
  <g transform="translate(615, 115)">
    <rect x="0" y="10" width="130" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="35" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">RIGHT DC MOTOR</text>
    <text x="65" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">(Yellow BO Gear Motor)</text>
    <!-- Wire to M2 -->
    <path d="M 0 35 L -85 130" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 0 55 L -85 160" fill="none" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- BATTERY PACK -->
  <g transform="translate(15, 360)">
    <rect x="0" y="10" width="140" height="90" rx="8" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
    <text x="70" y="35" fill="#fdf2f8" font-size="12" font-weight="bold" text-anchor="middle">2x 18650 Li-ion</text>
    <text x="70" y="52" fill="#fbcfe8" font-size="11" text-anchor="middle">Battery (7.4V)</text>
    <text x="70" y="70" fill="#93c5fd" font-size="9" text-anchor="middle">with Power Switch</text>
    <!-- Positive & Negative wires to EXT_PWR -->
    <path d="M 140 40 L 235 440" fill="none" stroke="#ef4444" stroke-width="3"/>
    <path d="M 140 65 L 265 440" fill="none" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- BLUETOOTH HC-05 (Practical 3.6) -->
  <g transform="translate(615, 330)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="25" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">HC-05 BLUETOOTH</text>
    <text x="90" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">(Practical 3.6 Remote)</text>

    <text x="20" y="70" fill="#ef4444" font-size="10">VCC  ──── 5V (Shield)</text>
    <text x="20" y="90" fill="#94a3b8" font-size="10">GND  ──── GND (Shield)</text>
    <text x="20" y="110" fill="#38bdf8" font-size="10">TXD  ──── A0 (RX)</text>
    <text x="20" y="130" fill="#a855f7" font-size="10">RXD  ──── 1k/2k Div ── A1 (TX)</text>
  </g>
</svg>
