<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#0b1120;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="icBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="termBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="460" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">L293D Motor Driver Shield Wiring (Practicals 3.1 to 3.6)</text>
  <text x="460" y="52" fill="#94a3b8" font-size="13" text-anchor="middle">Arduino UNO + L293D Shield (Left Motor → M1, Right Motor → M2, Bluetooth → A0/A1)</text>

  <!-- LEFT MOTOR BOX -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">LEFT DC MOTOR</text>
    <text x="80" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Yellow BO Gear Motor</text>
    <circle cx="150" cy="65" r="5" fill="#ef4444"/><text x="135" y="69" fill="#ef4444" font-size="10" font-weight="bold">M+</text>
    <circle cx="150" cy="80" r="5" fill="#000000" stroke="#64748b" stroke-width="1"/><text x="135" y="84" fill="#94a3b8" font-size="10" font-weight="bold">M-</text>
  </g>

  <!-- RIGHT MOTOR BOX -->
  <g transform="translate(730, 90)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">RIGHT DC MOTOR</text>
    <text x="80" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Yellow BO Gear Motor</text>
    <circle cx="10" cy="65" r="5" fill="#ef4444"/><text x="25" y="69" fill="#ef4444" font-size="10" font-weight="bold">M+</text>
    <circle cx="10" cy="80" r="5" fill="#000000" stroke="#64748b" stroke-width="1"/><text x="25" y="84" fill="#94a3b8" font-size="10" font-weight="bold">M-</text>
  </g>

  <!-- BATTERY PACK BOX -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="170" height="110" rx="8" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="85" y="30" fill="#fdf2f8" font-size="13" font-weight="bold" text-anchor="middle">2x 18650 Li-ion</text>
    <text x="85" y="48" fill="#fbcfe8" font-size="11" text-anchor="middle">7.4V Battery Pack</text>
    <text x="85" y="65" fill="#93c5fd" font-size="10" text-anchor="middle">with Power Switch</text>
    <circle cx="160" cy="82" r="5" fill="#ef4444"/><text x="145" y="86" fill="#ef4444" font-size="11" font-weight="bold">(+)</text>
    <circle cx="160" cy="98" r="5" fill="#000000" stroke="#64748b" stroke-width="1"/><text x="145" y="102" fill="#94a3b8" font-size="11" font-weight="bold">(-)</text>
  </g>

  <!-- BLUETOOTH HC-05 BOX -->
  <g transform="translate(710, 320)">
    <rect x="0" y="0" width="180" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="28" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">HC-05 BLUETOOTH</text>
    <text x="90" y="46" fill="#94a3b8" font-size="10" text-anchor="middle">(Practical 3.6 Teleoperation)</text>
    
    <circle cx="15" cy="70" r="4" fill="#ef4444"/><text x="25" y="74" fill="#ef4444" font-size="10">VCC (5V)</text>
    <circle cx="15" cy="95" r="4" fill="#94a3b8"/><text x="25" y="99" fill="#94a3b8" font-size="10">GND (0V)</text>
    <circle cx="15" cy="120" r="4" fill="#38bdf8"/><text x="25" y="124" fill="#38bdf8" font-size="10">TXD → A0 (RX)</text>
    <circle cx="15" cy="145" r="4" fill="#a855f7"/><text x="25" y="149" fill="#a855f7" font-size="10">RXD → 1k/2k → A1 (TX)</text>
  </g>

  <!-- CENTRAL L293D MOTOR SHIELD -->
  <g transform="translate(250, 75)">
    <!-- Blue PCB -->
    <rect x="0" y="0" width="420" height="430" rx="16" fill="url(#shieldBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="210" y="28" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">L293D MOTOR DRIVER SHIELD</text>

    <!-- Top Headers (Arduino Digital) -->
    <rect x="40" y="42" width="340" height="15" rx="3" fill="#0f172a"/>
    <text x="210" y="53" fill="#64748b" font-size="9" text-anchor="middle">ARDUINO DIGITAL HEADER PINS (D0 to D13)</text>

    <!-- Left Screw Terminal Block: M1 (Top) & M2 (Bottom) -->
    <rect x="-15" y="80" width="40" height="85" rx="4" fill="url(#termBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="5" cy="98" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <circle cx="5" cy="122" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <circle cx="5" cy="148" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <text x="15" y="90" fill="#ffffff" font-size="11" font-weight="bold">M1</text>
    <text x="15" y="140" fill="#ffffff" font-size="11" font-weight="bold">M2</text>

    <!-- Right Screw Terminal Block: M3 (Top) & M4 (Bottom) -->
    <rect x="395" y="80" width="40" height="85" rx="4" fill="url(#termBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="415" cy="98" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <circle cx="415" cy="122" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <circle cx="415" cy="148" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <text x="385" y="90" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="end">M3</text>
    <text x="385" y="140" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="end">M4</text>

    <!-- IC1 L293D (Left) -->
    <rect x="65" y="100" width="60" height="130" rx="5" fill="url(#icBlack)" stroke="#64748b" stroke-width="1.5"/>
    <text x="95" y="170" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 95 170)">L293D (IC1)</text>

    <!-- IC3 74HC595 (Middle Shift Register) -->
    <rect x="180" y="115" width="60" height="110" rx="5" fill="url(#icBlack)" stroke="#64748b" stroke-width="1.5"/>
    <text x="210" y="175" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 210 175)">74HC595 (IC3)</text>

    <!-- IC2 L293D (Right) -->
    <rect x="295" y="100" width="60" height="130" rx="5" fill="url(#icBlack)" stroke="#64748b" stroke-width="1.5"/>
    <text x="325" y="170" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 325 170)">L293D (IC2)</text>

    <!-- EXT_PWR Blue Screw Terminal (Bottom Left) -->
    <rect x="30" y="350" width="80" height="55" rx="4" fill="url(#termBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="50" cy="380" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <circle cx="90" cy="380" r="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1"/>
    <text x="50" y="367" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">+M</text>
    <text x="90" y="367" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">GND</text>
    <text x="70" y="398" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">EXT_PWR</text>

    <!-- PWR Jumper -->
    <rect x="145" y="360" width="35" height="24" rx="4" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="162" y="352" fill="#86efac" font-size="10" font-weight="bold" text-anchor="middle">PWR</text>
    <text x="162" y="376" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">ON</text>

    <!-- Analog Breakout Header (Bottom Right) -->
    <rect x="255" y="340" width="145" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="327" y="355" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">Analog Header (A0 - A5)</text>
    
    <!-- Header Pins with dots -->
    <circle cx="275" cy="375" r="5" fill="#ef4444"/><text x="275" y="398" fill="#ef4444" font-size="10" text-anchor="middle">5V</text>
    <circle cx="305" cy="375" r="5" fill="#94a3b8"/><text x="305" y="398" fill="#94a3b8" font-size="10" text-anchor="middle">GND</text>
    <circle cx="335" cy="375" r="5" fill="#38bdf8"/><text x="335" y="398" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">A0</text>
    <circle cx="365" cy="375" r="5" fill="#a855f7"/><text x="365" y="398" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">A1</text>
  </g>

  <!-- WIRING CONNECTIONS (EXACT PIN-TO-PIN PATHS) -->

  <!-- Left Motor Wires -> M1 Terminal -->
  <path d="M 180 155 L 255 173" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <path d="M 180 170 L 255 197" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="255" cy="173" r="3" fill="#ef4444"/>
  <circle cx="255" cy="197" r="3" fill="#000000"/>

  <!-- Right Motor Wires -> M2 Terminal (Or M3 on right) -->
  <path d="M 740 155 L 665 173" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <path d="M 740 170 L 665 197" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="665" cy="173" r="3" fill="#ef4444"/>
  <circle cx="665" cy="197" r="3" fill="#000000"/>

  <!-- Battery Wires -> EXT_PWR (+M and GND) -->
  <path d="M 190 442 L 300 455" fill="none" stroke="#ef4444" stroke-width="3"/>
  <path d="M 190 458 L 340 455" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="300" cy="455" r="4" fill="#ef4444"/>
  <circle cx="340" cy="455" r="4" fill="#000000"/>

  <!-- Bluetooth Wires -> Analog Header (A0, A1, 5V, GND) -->
  <path d="M 725 390 L 525 450" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M 725 415 L 555 450" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 725 440 L 585 450" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 725 465 L 615 450" fill="none" stroke="#a855f7" stroke-width="2"/>
  <circle cx="525" cy="450" r="3" fill="#ef4444"/>
  <circle cx="555" cy="450" r="3" fill="#94a3b8"/>
  <circle cx="585" cy="450" r="3" fill="#38bdf8"/>
  <circle cx="615" cy="450" r="3" fill="#a855f7"/>
</svg>
