<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%" style="background:#0b1120;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="unoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="l298nRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- ================= MASTER TITLE (No wires will cross this area) ================= -->
  <text x="490" y="24" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">L298N Driver Module &amp; Autonomous Navigation Wiring</text>
  <text x="490" y="42" fill="#94a3b8" font-size="12" text-anchor="middle">Practicals 3.7 (Dual TCRT5000 IR Line Following) &amp; 3.8 (HC-SR04 Obstacle Avoidance)</text>

  <!-- ================= 1. ARDUINO UNO R3 (Left) ================= -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="190" height="495" rx="14" fill="url(#unoBlue)" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ARDUINO UNO R3</text>
    
    <!-- Digital Header Row -->
    <rect x="145" y="40" width="38" height="440" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    
    <!-- Pin 2: Left IR -->
    <text x="135" y="69" fill="#34d399" font-size="11" font-weight="bold" text-anchor="end">Pin 2 (Left IR)</text>
    <circle cx="164" cy="65" r="5" fill="#34d399"/>

    <!-- Pin 3: Right IR -->
    <text x="135" y="99" fill="#34d399" font-size="11" font-weight="bold" text-anchor="end">Pin 3 (Right IR)</text>
    <circle cx="164" cy="95" r="5" fill="#34d399"/>

    <!-- Pin 5: ENA PWM -->
    <text x="135" y="139" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">Pin 5 (ENA PWM)</text>
    <circle cx="164" cy="135" r="5" fill="#fbbf24"/>

    <!-- Pin 6: ENB PWM -->
    <text x="135" y="169" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">Pin 6 (ENB PWM)</text>
    <circle cx="164" cy="165" r="5" fill="#fbbf24"/>

    <!-- Pin 8: IN1 -->
    <text x="135" y="209" fill="#38bdf8" font-size="11" text-anchor="end">Pin 8 (IN1)</text>
    <circle cx="164" cy="205" r="5" fill="#38bdf8"/>

    <!-- Pin 9: IN2 / TRIG -->
    <text x="135" y="239" fill="#60a5fa" font-size="11" text-anchor="end">Pin 9 (IN2/TRIG)</text>
    <circle cx="164" cy="235" r="5" fill="#60a5fa"/>

    <!-- Pin 10: IN3 / ECHO -->
    <text x="135" y="269" fill="#a78bfa" font-size="11" text-anchor="end">Pin 10 (IN3/ECHO)</text>
    <circle cx="164" cy="265" r="5" fill="#a78bfa"/>

    <!-- Pin 11: IN4 -->
    <text x="135" y="299" fill="#c084fc" font-size="11" text-anchor="end">Pin 11 (IN4)</text>
    <circle cx="164" cy="295" r="5" fill="#c084fc"/>

    <!-- 5V Logic Power -->
    <text x="135" y="379" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="end">5V Power</text>
    <circle cx="164" cy="375" r="5" fill="#ef4444"/>

    <!-- GND Common -->
    <text x="135" y="429" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="end">GND Common</text>
    <circle cx="164" cy="425" r="5" fill="#94a3b8"/>
  </g>

  <!-- ================= 2. L298N MOTOR DRIVER (Center Top) ================= -->
  <g transform="translate(300, 65)">
    <rect x="0" y="0" width="270" height="255" rx="14" fill="url(#l298nRed)" stroke="#f87171" stroke-width="2"/>
    <text x="135" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L298N DUAL H-BRIDGE</text>

    <!-- Heatsink in Center -->
    <rect x="95" y="36" width="80" height="46" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
    <text x="135" y="64" fill="#9ca3af" font-size="10" font-weight="bold" text-anchor="middle">HEATSINK</text>

    <!-- Motor Terminals OUT1/2 & OUT3/4 -->
    <rect x="-14" y="50" width="24" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="74" fill="#ffffff" font-size="9" font-weight="bold">OUT1/2</text>

    <rect x="260" y="50" width="24" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="254" y="74" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="end">OUT3/4</text>

    <!-- Logic Pins Header -->
    <rect x="18" y="105" width="234" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="135" y="122" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle">Logic Control Header</text>
    
    <g transform="translate(36, 145)">
      <circle cx="0" cy="0" r="5" fill="#fbbf24"/><text x="0" y="-8" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">ENA</text>
      <circle cx="38" cy="0" r="5" fill="#38bdf8"/><text x="38" y="-8" fill="#38bdf8" font-size="9" text-anchor="middle">IN1</text>
      <circle cx="76" cy="0" r="5" fill="#60a5fa"/><text x="76" y="-8" fill="#60a5fa" font-size="9" text-anchor="middle">IN2</text>
      <circle cx="120" cy="0" r="5" fill="#a78bfa"/><text x="120" y="-8" fill="#a78bfa" font-size="9" text-anchor="middle">IN3</text>
      <circle cx="158" cy="0" r="5" fill="#c084fc"/><text x="158" y="-8" fill="#c084fc" font-size="9" text-anchor="middle">IN4</text>
      <circle cx="196" cy="0" r="5" fill="#fbbf24"/><text x="196" y="-8" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">ENB</text>
    </g>

    <!-- Power Screw Terminal (12V, GND, 5V) -->
    <rect x="65" y="185" width="140" height="52" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <g transform="translate(85, 212)">
      <circle cx="15" cy="0" r="6" fill="#e2e8f0" stroke="#ef4444" stroke-width="2"/>
      <text x="15" y="18" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">12V</text>

      <circle cx="50" cy="0" r="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <text x="50" y="18" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">GND</text>

      <circle cx="85" cy="0" r="6" fill="#e2e8f0" stroke="#ef4444" stroke-width="2"/>
      <text x="85" y="18" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">5V</text>
    </g>
  </g>

  <!-- ================= 3. BATTERY PACK (Center Bottom) ================= -->
  <g transform="translate(300, 360)">
    <rect x="0" y="0" width="270" height="135" rx="10" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="135" y="28" fill="#fdf2f8" font-size="13" font-weight="bold" text-anchor="middle">2x 18650 Battery Pack (7.4V)</text>
    <text x="135" y="46" fill="#fbcfe8" font-size="11" text-anchor="middle">External Motor Supply</text>

    <!-- Battery Posts -->
    <g transform="translate(50, 70)">
      <rect x="0" y="0" width="70" height="42" rx="5" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
      <circle cx="35" cy="18" r="5" fill="#ef4444"/><text x="35" y="34" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">(+) 7.4V</text>
    </g>

    <g transform="translate(150, 70)">
      <rect x="0" y="0" width="70" height="42" rx="5" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
      <circle cx="35" cy="18" r="5" fill="#000000" stroke="#94a3b8" stroke-width="1.5"/><text x="35" y="34" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">(−) GND</text>
    </g>
  </g>

  <!-- ================= 4. SENSORS (Right Column) ================= -->

  <!-- Top Right: Practical 3.7 Dual TCRT5000 IR -->
  <g transform="translate(635, 65)">
    <rect x="0" y="0" width="310" height="195" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="2"/>
    <text x="155" y="24" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Practical 3.7: Dual TCRT5000 IR</text>
    <text x="155" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Optical Line Tracking Reflectance Sensors</text>

    <!-- Left IR Module -->
    <rect x="15" y="55" width="130" height="95" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="80" y="74" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">LEFT SENSOR</text>
    <circle cx="35" cy="95" r="4" fill="#34d399"/><text x="45" y="99" fill="#ffffff" font-size="10">OUT → Pin 2</text>
    <circle cx="35" cy="115" r="4" fill="#ef4444"/><text x="45" y="119" fill="#ef4444" font-size="10">VCC → 5V</text>
    <circle cx="35" cy="135" r="4" fill="#94a3b8"/><text x="45" y="139" fill="#94a3b8" font-size="10">GND</text>

    <!-- Right IR Module -->
    <rect x="165" y="55" width="130" height="95" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="230" y="74" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">RIGHT SENSOR</text>
    <circle cx="185" cy="95" r="4" fill="#34d399"/><text x="195" y="99" fill="#ffffff" font-size="10">OUT → Pin 3</text>
    <circle cx="185" cy="115" r="4" fill="#ef4444"/><text x="195" y="119" fill="#ef4444" font-size="10">VCC → 5V</text>
    <circle cx="185" cy="135" r="4" fill="#94a3b8"/><text x="195" y="139" fill="#94a3b8" font-size="10">GND</text>

    <text x="155" y="174" fill="#fbbf24" font-size="10" text-anchor="middle">Tuning: Adjust pot until LED on black tape</text>
  </g>

  <!-- Bottom Right: Practical 3.8 HC-SR04 Ultrasonic -->
  <g transform="translate(635, 285)">
    <rect x="0" y="0" width="310" height="225" rx="12" fill="url(#cardBg)" stroke="#60a5fa" stroke-width="2"/>
    <text x="155" y="24" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">Practical 3.8: HC-SR04 Ultrasonic</text>
    <text x="155" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Distance Sensing &amp; Collision Avoidance</text>

    <!-- Ultrasonic Eyes Graphic -->
    <rect x="25" y="55" width="260" height="85" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="85" cy="97" r="22" fill="#374151" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="85" cy="97" r="11" fill="#1e293b"/>
    <text x="85" y="101" fill="#60a5fa" font-size="9" text-anchor="middle">TRIG</text>

    <circle cx="205" cy="97" r="22" fill="#374151" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="205" cy="97" r="11" fill="#1e293b"/>
    <text x="205" y="101" fill="#a78bfa" font-size="9" text-anchor="middle">ECHO</text>

    <!-- Sensor Pins Row with Connection Terminals -->
    <rect x="25" y="150" width="260" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <g transform="translate(45, 175)">
      <!-- VCC -->
      <circle cx="10" cy="5" r="4" fill="#ef4444"/><text x="10" y="-3" fill="#ef4444" font-size="9" font-weight="bold" text-anchor="middle">VCC</text>
      <!-- TRIG -->
      <circle cx="70" cy="5" r="4" fill="#60a5fa"/><text x="70" y="-3" fill="#60a5fa" font-size="9" font-weight="bold" text-anchor="middle">TRIG</text>
      <!-- ECHO -->
      <circle cx="140" cy="5" r="4" fill="#a78bfa"/><text x="140" y="-3" fill="#a78bfa" font-size="9" font-weight="bold" text-anchor="middle">ECHO</text>
      <!-- GND -->
      <circle cx="200" cy="5" r="4" fill="#94a3b8"/><text x="200" y="-3" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- ================= 5. COMPLETE ELECTRICAL WIRING (No Crossed Text) ================= -->

  <!-- A. Logic Control Bus (Arduino -> L298N Header) -->
  <!-- D5 (ENA) -> L298N ENA -->
  <path d="M 194 200 H 240 V 220 H 336" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="336" cy="210" r="3" fill="#fbbf24"/>

  <!-- D6 (ENB) -> L298N ENB -->
  <path d="M 194 230 H 250 V 265 H 532 V 220" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="532" cy="210" r="3" fill="#fbbf24"/>

  <!-- D8 (IN1) -> L298N IN1 -->
  <path d="M 194 270 H 260 V 230 H 374 V 220" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="374" cy="210" r="3" fill="#38bdf8"/>

  <!-- D9 (IN2 / TRIG) -> L298N IN2 (and branches to Ultrasonic TRIG) -->
  <path d="M 194 300 H 270 V 240 H 412 V 220" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="412" cy="210" r="3" fill="#60a5fa"/>

  <!-- D10 (IN3 / ECHO) -> L298N IN3 (and branches to Ultrasonic ECHO) -->
  <path d="M 194 330 H 280 V 250 H 456 V 220" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="456" cy="210" r="3" fill="#a78bfa"/>

  <!-- D11 (IN4) -> L298N IN4 -->
  <path d="M 194 360 H 290 V 258 H 494 V 220" fill="none" stroke="#c084fc" stroke-width="2"/>
  <circle cx="494" cy="210" r="3" fill="#c084fc"/>

  <!-- B. Battery Power to L298N (Clean Straight Vertical Lines) -->
  <!-- (+) 7.4V Battery -> 12V Screw (x=385) -->
  <path d="M 385 430 V 285" fill="none" stroke="#ef4444" stroke-width="3"/>
  <circle cx="385" cy="430" r="4" fill="#ef4444"/>
  <circle cx="385" cy="277" r="4" fill="#ef4444"/>

  <!-- (-) GND Battery -> GND Screw (x=435) -->
  <path d="M 485 430 H 435 V 285" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="485" cy="430" r="4" fill="#000000"/>
  <circle cx="435" cy="277" r="4" fill="#94a3b8"/>

  <!-- C. Common GND Wire (Routes CLEANLY UNDER the Battery Box) -->
  <path d="M 194 490 H 260 V 535 H 485 V 450" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="194" cy="490" r="3.5" fill="#94a3b8"/>
  <circle cx="485" cy="450" r="3.5" fill="#94a3b8"/>
  <text x="350" y="528" fill="#94a3b8" font-size="10" font-weight="bold">Common GND Bus (Arduino GND to Battery GND)</text>

  <!-- D. Sensor 3.7 Overhead Routing (Runs in clear channel above cards) -->
  <!-- D2 -> Left IR OUT -->
  <path d="M 194 130 H 240 V 55 H 670 V 160" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle cx="194" cy="130" r="3" fill="#34d399"/>
  <circle cx="670" cy="160" r="3" fill="#34d399"/>

  <!-- D3 -> Right IR OUT -->
  <path d="M 194 160 H 230 V 48 H 820 V 160" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle cx="194" cy="160" r="3" fill="#34d399"/>
  <circle cx="820" cy="160" r="3" fill="#34d399"/>

  <!-- E. Ultrasonic Sensor 3.8 Routing (Clean routing from Arduino D9 & D10) -->
  <!-- D9 (TRIG) -> Ultrasonic TRIG -->
  <path d="M 194 300 H 270 V 345 H 610 V 460 H 750" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="750" cy="460" r="3.5" fill="#60a5fa"/>

  <!-- D10 (ECHO) -> Ultrasonic ECHO -->
  <path d="M 194 330 H 280 V 355 H 620 V 460 H 820" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="820" cy="460" r="3.5" fill="#a78bfa"/>
</svg>
