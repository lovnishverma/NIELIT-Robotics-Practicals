<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="l298nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="unoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="420" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">L298N Driver Module &amp; Autonomous Sensors Wiring</text>
  <text x="420" y="52" fill="#94a3b8" font-size="13" text-anchor="middle">Practicals 3.7 (TCRT5000 Line Following) &amp; 3.8 (HC-SR04 Obstacle Avoidance)</text>

  <!-- ARDUINO UNO R3 -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="220" height="380" rx="12" fill="url(#unoGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="30" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ARDUINO UNO R3</text>
    
    <!-- Digital Header -->
    <rect x="180" y="50" width="30" height="310" rx="4" fill="#0f172a"/>
    <text x="165" y="75" fill="#f8fafc" font-size="10" text-anchor="end">Pin 2 (Left IR)</text>
    <text x="165" y="100" fill="#f8fafc" font-size="10" text-anchor="end">Pin 3 (Right IR)</text>
    <text x="165" y="130" fill="#fbbf24" font-size="10" text-anchor="end">Pin 5 (ENA PWM)</text>
    <text x="165" y="155" fill="#fbbf24" font-size="10" text-anchor="end">Pin 6 (ENB PWM)</text>
    <text x="165" y="185" fill="#38bdf8" font-size="10" text-anchor="end">Pin 8 / 2 (IN1)</text>
    <text x="165" y="210" fill="#38bdf8" font-size="10" text-anchor="end">Pin 9 / 3 (IN2/TRIG)</text>
    <text x="165" y="235" fill="#38bdf8" font-size="10" text-anchor="end">Pin 10 / 4 (IN3/ECHO)</text>
    <text x="165" y="260" fill="#38bdf8" font-size="10" text-anchor="end">Pin 11 / 7 (IN4)</text>
    <text x="165" y="295" fill="#ef4444" font-size="10" text-anchor="end">5V (Logic)</text>
    <text x="165" y="325" fill="#94a3b8" font-size="10" text-anchor="end">GND (Common)</text>
  </g>

  <!-- L298N MOTOR DRIVER MODULE -->
  <g transform="translate(320, 85)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#l298nGrad)" stroke="#f87171" stroke-width="2"/>
    <text x="110" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L298N DRIVER</text>
    
    <!-- Heatsink in middle -->
    <rect x="75" y="45" width="70" height="50" rx="4" fill="#374151" stroke="#4b5563" stroke-width="1"/>
    <text x="110" y="75" fill="#9ca3af" font-size="9" text-anchor="middle">L298N IC</text>

    <!-- Motor Screw Terminals -->
    <rect x="5" y="55" width="20" height="40" rx="3" fill="#1e293b"/>
    <text x="15" y="45" fill="#fbbf24" font-size="9" text-anchor="middle">OUT1/2</text>
    <rect x="195" y="55" width="20" height="40" rx="3" fill="#1e293b"/>
    <text x="205" y="45" fill="#fbbf24" font-size="9" text-anchor="middle">OUT3/4</text>

    <!-- Logic Pins Row -->
    <rect x="25" y="175" width="170" height="45" rx="4" fill="#0f172a"/>
    <text x="110" y="195" fill="#93c5fd" font-size="10" text-anchor="middle">ENA  IN1  IN2  IN3  IN4  ENB</text>
    <text x="110" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">(Logic Control Header)</text>

    <!-- Power Terminal -->
    <rect x="65" y="115" width="90" height="40" rx="4" fill="#0f172a"/>
    <text x="110" y="132" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">12V   GND   5V</text>
    <text x="110" y="146" fill="#94a3b8" font-size="8" text-anchor="middle">Batt(+)  GND   5V_in</text>
  </g>

  <!-- BATTERY -->
  <g transform="translate(320, 355)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
    <text x="110" y="30" fill="#fdf2f8" font-size="13" font-weight="bold" text-anchor="middle">2x 18650 Battery Pack</text>
    <text x="110" y="50" fill="#fbcfe8" font-size="11" text-anchor="middle">7.4V External Motor Power</text>
    <text x="110" y="75" fill="#e2e8f0" font-size="10" text-anchor="middle">(+) to L298N 12V  |  (-) to Common GND</text>
  </g>

  <!-- SENSORS RIGHT COLUMN -->
  <!-- 3.7 TCRT5000 IR -->
  <g transform="translate(580, 85)">
    <rect x="0" y="0" width="230" height="180" rx="10" fill="url(#sensorGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="115" y="25" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Practical 3.7: Dual TCRT5000 IR</text>
    <text x="115" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Line Tracking Reflectance Sensors</text>

    <text x="20" y="70" fill="#f8fafc" font-size="11">Left IR Sensor (OUT)  <tspan fill="#38bdf8" font-weight="bold">→ Pin 2</tspan></text>
    <text x="20" y="95" fill="#f8fafc" font-size="11">Right IR Sensor (OUT) <tspan fill="#38bdf8" font-weight="bold">→ Pin 3</tspan></text>
    <text x="20" y="120" fill="#ef4444" font-size="11">VCC (Both Modules)    <tspan fill="#ef4444" font-weight="bold">→ 5V</tspan></text>
    <text x="20" y="145" fill="#94a3b8" font-size="11">GND (Both Modules)    <tspan fill="#94a3b8" font-weight="bold">→ GND</tspan></text>
    <text x="115" y="168" fill="#fbbf24" font-size="9" text-anchor="middle">Adjust blue pot so LED turns ON on black tape</text>
  </g>

  <!-- 3.8 HC-SR04 ULTRASONIC -->
  <g transform="translate(580, 285)">
    <rect x="0" y="0" width="230" height="180" rx="10" fill="url(#sensorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="115" y="25" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">Practical 3.8: HC-SR04 Ultrasound</text>
    <text x="115" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Obstacle Detection &amp; Avoidance</text>

    <text x="20" y="75" fill="#f8fafc" font-size="11">TRIG Pulse Output     <tspan fill="#38bdf8" font-weight="bold">→ Pin 9</tspan></text>
    <text x="20" y="100" fill="#f8fafc" font-size="11">ECHO Return Input     <tspan fill="#38bdf8" font-weight="bold">→ Pin 10</tspan></text>
    <text x="20" y="125" fill="#ef4444" font-size="11">VCC Power             <tspan fill="#ef4444" font-weight="bold">→ 5V</tspan></text>
    <text x="20" y="150" fill="#94a3b8" font-size="11">GND Common           <tspan fill="#94a3b8" font-weight="bold">→ GND</tspan></text>
  </g>
</svg>
