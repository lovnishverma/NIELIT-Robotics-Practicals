<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0b1120;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="unoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="l298nRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="motorYel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="480" y="28" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">L298N Driver Module &amp; Autonomous Navigation Wiring</text>
  <text x="480" y="46" fill="#94a3b8" font-size="12" text-anchor="middle">Practicals 3.7 (Dual TCRT5000 IR Line Following) &amp; 3.8 (HC-SR04 Obstacle Avoidance)</text>

  <!-- ================= 1. ARDUINO UNO R3 (Left) ================= -->
  <g transform="translate(30, 65)">
    <!-- Board Body -->
    <rect x="0" y="0" width="190" height="495" rx="14" fill="url(#unoBlue)" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ARDUINO UNO R3</text>
    
    <!-- Digital Header Row -->
    <rect x="145" y="42" width="38" height="435" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    
    <!-- Pins (Labels on left, dots on right) -->
    <!-- D2: Left IR -->
    <text x="135" y="69" fill="#34d399" font-size="11" font-weight="bold" text-anchor="end">Pin 2 (Left IR)</text>
    <circle cx="164" cy="65" r="5" fill="#34d399"/>

    <!-- D3: Right IR -->
    <text x="135" y="99" fill="#34d399" font-size="11" font-weight="bold" text-anchor="end">Pin 3 (Right IR)</text>
    <circle cx="164" cy="95" r="5" fill="#34d399"/>

    <!-- D5: ENA PWM -->
    <text x="135" y="139" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">Pin 5 (ENA PWM)</text>
    <circle cx="164" cy="135" r="5" fill="#fbbf24"/>

    <!-- D6: ENB PWM -->
    <text x="135" y="169" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">Pin 6 (ENB PWM)</text>
    <circle cx="164" cy="165" r="5" fill="#fbbf24"/>

    <!-- D8: IN1 -->
    <text x="135" y="209" fill="#38bdf8" font-size="11" text-anchor="end">Pin 8 (IN1)</text>
    <circle cx="164" cy="205" r="5" fill="#38bdf8"/>

    <!-- D9: IN2 / TRIG -->
    <text x="135" y="239" fill="#60a5fa" font-size="11" text-anchor="end">Pin 9 (IN2/TRIG)</text>
    <circle cx="164" cy="235" r="5" fill="#60a5fa"/>

    <!-- D10: IN3 / ECHO -->
    <text x="135" y="269" fill="#a78bfa" font-size="11" text-anchor="end">Pin 10 (IN3/ECHO)</text>
    <circle cx="164" cy="265" r="5" fill="#a78bfa"/>

    <!-- D11: IN4 -->
    <text x="135" y="299" fill="#c084fc" font-size="11" text-anchor="end">Pin 11 (IN4)</text>
    <circle cx="164" cy="295" r="5" fill="#c084fc"/>

    <!-- 5V Logic Power -->
    <text x="135" y="379" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="end">5V Power</text>
    <circle cx="164" cy="375" r="5" fill="#ef4444"/>

    <!-- GND Common -->
    <text x="135" y="429" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="end">GND Common</text>
    <circle cx="164" cy="425" r="5" fill="#94a3b8"/>
  </g>

  <!-- ================= 2. L298N MOTOR DRIVER (Center) ================= -->
  <g transform="translate(320, 65)">
    <rect x="0" y="0" width="270" height="260" rx="14" fill="url(#l298nRed)" stroke="#f87171" stroke-width="2"/>
    <text x="135" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L298N DUAL H-BRIDGE</text>

    <!-- Heatsink in Center -->
    <rect x="95" y="40" width="80" height="50" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
    <text x="135" y="70" fill="#9ca3af" font-size="10" font-weight="bold" text-anchor="middle">HEATSINK</text>

    <!-- Motor Terminals OUT1/OUT2 (Left) & OUT3/OUT4 (Right) -->
    <rect x="-14" y="55" width="26" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-1" cy="67" r="4" fill="#e2e8f0"/>
    <circle cx="-1" cy="83" r="4" fill="#e2e8f0"/>
    <text x="18" y="79" fill="#ffffff" font-size="10" font-weight="bold">OUT1/2</text>

    <rect x="258" y="55" width="26" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="271" cy="67" r="4" fill="#e2e8f0"/>
    <circle cx="271" cy="83" r="4" fill="#e2e8f0"/>
    <text x="252" y="79" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="end">OUT3/4</text>

    <!-- Logic Pins Header (ENA, IN1, IN2, IN3, IN4, ENB) -->
    <rect x="20" y="115" width="230" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="135" y="132" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle">Logic Control Header</text>
    
    <g transform="translate(38, 155)">
      <circle cx="0" cy="0" r="5" fill="#fbbf24"/><text x="0" y="-8" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">ENA</text>
      <circle cx="38" cy="0" r="5" fill="#38bdf8"/><text x="38" y="-8" fill="#38bdf8" font-size="9" text-anchor="middle">IN1</text>
      <circle cx="76" cy="0" r="5" fill="#60a5fa"/><text x="76" y="-8" fill="#60a5fa" font-size="9" text-anchor="middle">IN2</text>
      <circle cx="118" cy="0" r="5" fill="#a78bfa"/><text x="118" y="-8" fill="#a78bfa" font-size="9" text-anchor="middle">IN3</text>
      <circle cx="156" cy="0" r="5" fill="#c084fc"/><text x="156" y="-8" fill="#c084fc" font-size="9" text-anchor="middle">IN4</text>
      <circle cx="194" cy="0" r="5" fill="#fbbf24"/><text x="194" y="-8" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">ENB</text>
    </g>

    <!-- Power Terminals (12V, GND, 5V) -->
    <rect x="65" y="195" width="140" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <g transform="translate(85, 220)">
      <circle cx="15" cy="0" r="5" fill="#ef4444"/><text x="15" y="18" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">12V</text>
      <circle cx="50" cy="0" r="5" fill="#94a3b8"/><text x="50" y="18" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">GND</text>
      <circle cx="85" cy="0" r="5" fill="#ef4444"/><text x="85" y="18" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">5V</text>
    </g>
  </g>

  <!-- ================= 3. BATTERY PACK (Bottom Center) ================= -->
  <g transform="translate(320, 370)">
    <rect x="0" y="0" width="270" height="135" rx="10" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="135" y="30" fill="#fdf2f8" font-size="13" font-weight="bold" text-anchor="middle">2x 18650 Battery Pack (7.4V)</text>
    <text x="135" y="48" fill="#fbcfe8" font-size="11" text-anchor="middle">External High-Current Motor Power</text>

    <!-- Battery Terminal Posts -->
    <rect x="40" y="70" width="80" height="45" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
    <circle cx="80" cy="85" r="5" fill="#ef4444"/><text x="80" y="105" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">(+) 7.4V</text>

    <rect x="150" y="70" width="80" height="45" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
    <circle cx="190" cy="85" r="5" fill="#000000" stroke="#94a3b8" stroke-width="1.5"/><text x="190" y="105" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">(-) GND</text>
  </g>

  <!-- ================= 4. SENSORS (Right Column) ================= -->

  <!-- Top Right: Practical 3.7 Dual TCRT5000 IR -->
  <g transform="translate(640, 65)">
    <rect x="0" y="0" width="290" height="200" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="2"/>
    <text x="145" y="26" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Practical 3.7: Dual TCRT5000 IR</text>
    <text x="145" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Optical Line Tracking Sensors</text>

    <!-- Left IR Module -->
    <rect x="15" y="58" width="120" height="95" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="75" y="78" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">LEFT SENSOR</text>
    <circle cx="30" cy="98" r="4" fill="#34d399"/><text x="40" y="102" fill="#ffffff" font-size="10">OUT → D2</text>
    <circle cx="30" cy="120" r="4" fill="#ef4444"/><text x="40" y="124" fill="#ef4444" font-size="10">VCC → 5V</text>
    <circle cx="30" cy="140" r="4" fill="#94a3b8"/><text x="40" y="144" fill="#94a3b8" font-size="10">GND</text>

    <!-- Right IR Module -->
    <rect x="155" y="58" width="120" height="95" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="215" y="78" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">RIGHT SENSOR</text>
    <circle cx="170" cy="98" r="4" fill="#34d399"/><text x="180" y="102" fill="#ffffff" font-size="10">OUT → D3</text>
    <circle cx="170" cy="120" r="4" fill="#ef4444"/><text x="180" y="124" fill="#ef4444" font-size="10">VCC → 5V</text>
    <circle cx="170" cy="140" r="4" fill="#94a3b8"/><text x="180" y="144" fill="#94a3b8" font-size="10">GND</text>

    <text x="145" y="178" fill="#fbbf24" font-size="10" text-anchor="middle">Tuning: Adjust pot until LED on black tape</text>
  </g>

  <!-- Bottom Right: Practical 3.8 HC-SR04 Ultrasonic -->
  <g transform="translate(640, 290)">
    <rect x="0" y="0" width="290" height="215" rx="12" fill="url(#cardBg)" stroke="#60a5fa" stroke-width="2"/>
    <text x="145" y="26" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">Practical 3.8: HC-SR04 Ultrasonic</text>
    <text x="145" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Distance Sensing &amp; Collision Avoidance</text>

    <!-- Ultrasonic Eyes Graphic -->
    <rect x="25" y="60" width="240" height="85" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="80" cy="102" r="22" fill="#374151" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="80" cy="102" r="11" fill="#1e293b"/>
    <text x="80" y="106" fill="#60a5fa" font-size="9" text-anchor="middle">TRIG</text>

    <circle cx="190" cy="102" r="22" fill="#374151" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="190" cy="102" r="11" fill="#1e293b"/>
    <text x="190" y="106" fill="#a78bfa" font-size="9" text-anchor="middle">ECHO</text>

    <!-- Pin Connections Box -->
    <rect x="25" y="155" width="240" height="45" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="145" y="173" fill="#f8fafc" font-size="10" text-anchor="middle">
      <tspan fill="#ef4444" font-weight="bold">VCC → 5V</tspan> | 
      <tspan fill="#60a5fa" font-weight="bold">TRIG → Pin 9</tspan>
    </text>
    <text x="145" y="190" fill="#f8fafc" font-size="10" text-anchor="middle">
      <tspan fill="#a78bfa" font-weight="bold">ECHO → Pin 10</tspan> | 
      <tspan fill="#94a3b8" font-weight="bold">GND → GND</tspan>
    </text>
  </g>

  <!-- ================= 5. PROFESSIONAL ORTHOGONAL WIRING PATHS ================= -->

  <!-- A. Logic Control Bus (Arduino -> L298N Header) with neat stepped routing -->
  <!-- D5 (ENA) -> L298N ENA -->
  <path d="M 194 200 H 250 V 230 H 358" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="358" cy="220" r="3" fill="#fbbf24"/>

  <!-- D6 (ENB) -> L298N ENB -->
  <path d="M 194 230 H 260 V 275 H 514 V 225" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="514" cy="220" r="3" fill="#fbbf24"/>

  <!-- D8 (IN1) -> L298N IN1 -->
  <path d="M 194 270 H 270 V 240 H 396 V 225" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="396" cy="220" r="3" fill="#38bdf8"/>

  <!-- D9 (IN2) -> L298N IN2 -->
  <path d="M 194 300 H 280 V 250 H 434 V 225" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="434" cy="220" r="3" fill="#60a5fa"/>

  <!-- D10 (IN3) -> L298N IN3 -->
  <path d="M 194 330 H 290 V 260 H 476 V 225" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="476" cy="220" r="3" fill="#a78bfa"/>

  <!-- D11 (IN4) -> L298N IN4 -->
  <path d="M 194 360 H 300 V 270 H 514" fill="none" stroke="#c084fc" stroke-width="2"/>
  <circle cx="514" cy="220" r="3" fill="#c084fc"/>

  <!-- B. Battery Power to L298N -->
  <!-- (+) 7.4V Battery -> 12V L298N -->
  <path d="M 400 455 V 300" fill="none" stroke="#ef4444" stroke-width="3"/>
  <circle cx="400" cy="455" r="4" fill="#ef4444"/>
  <circle cx="400" cy="285" r="4" fill="#ef4444"/>

  <!-- (-) GND Battery -> GND L298N -->
  <path d="M 510 455 V 300" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="510" cy="455" r="4" fill="#000000"/>
  <circle cx="435" cy="285" r="4" fill="#94a3b8"/>

  <!-- C. Common GND from Arduino to Battery GND -->
  <path d="M 194 490 H 510" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- D. Sensor Overhead Routing (Neat top channel) -->
  <!-- D2 -> Left IR OUT -->
  <path d="M 194 130 H 240 V 52 H 670 V 163" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle cx="194" cy="130" r="3" fill="#34d399"/>
  <circle cx="670" cy="163" r="3" fill="#34d399"/>

  <!-- D3 -> Right IR OUT -->
  <path d="M 194 160 H 230 V 44 H 810 V 163" fill="none" stroke="#34d399" stroke-width="2"/>
  <circle cx="194" cy="160" r="3" fill="#34d399"/>
  <circle cx="810" cy="163" r="3" fill="#34d399"/>
</svg>
