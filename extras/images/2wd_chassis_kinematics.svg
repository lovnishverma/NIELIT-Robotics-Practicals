<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#0b1120;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <radialGradient id="casterGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
  </defs>

  <!-- Title Header -->
  <text x="460" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">2-Wheel Differential Drive Robot — Kinematics &amp; Chassis Architecture</text>
  <text x="460" y="52" fill="#94a3b8" font-size="13" text-anchor="middle">Dual Yellow BO Motors with Passive Balance Ball Caster Wheel</text>

  <!-- LEFT: 2WD Physical Chassis -->
  <g transform="translate(50, 75)">
    <!-- Chassis Body (Acrylic Plate) -->
    <path d="M 80 40 Q 160 15 240 40 L 260 70 L 260 300 Q 260 340 220 340 L 100 340 Q 60 340 60 300 L 60 70 Z" fill="url(#chassisGrad)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="160" y="35" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">▲ FRONT (Sensor Side)</text>

    <!-- Center Axle Line passing directly through wheel centers (Y=175) -->
    <line x1="15" y1="175" x2="305" y2="175" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="27" cy="175" r="4" fill="#38bdf8"/>
    <circle cx="293" cy="175" r="4" fill="#38bdf8"/>
    
    <!-- Track Width Label -->
    <rect x="105" y="165" width="110" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="179" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Track Width (L)</text>

    <!-- LEFT MOTOR & WHEEL (Centered at Y=175) -->
    <rect x="62" y="140" width="48" height="70" rx="5" fill="url(#motorGrad)" stroke="#b45309" stroke-width="1.5"/>
    <text x="86" y="179" fill="#78350f" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 86 179)">LEFT BO</text>
    
    <!-- Left Rubber Tire -->
    <rect x="15" y="125" width="24" height="100" rx="6" fill="url(#tireGrad)" stroke="#6b7280" stroke-width="1.5"/>
    
    <!-- Left Velocity Arrow (Solid Vector Path) -->
    <g transform="translate(27, 120)">
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#22c55e" stroke-width="3.5"/>
      <polygon points="0,-58 -6,-43 6,-43" fill="#22c55e"/>
      <text x="0" y="-66" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">v<tspan font-size="10" baseline-shift="sub">L</tspan></text>
    </g>

    <!-- RIGHT MOTOR & WHEEL (Centered at Y=175) -->
    <rect x="210" y="140" width="48" height="70" rx="5" fill="url(#motorGrad)" stroke="#b45309" stroke-width="1.5"/>
    <text x="234" y="179" fill="#78350f" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(90 234 179)">RIGHT BO</text>
    
    <!-- Right Rubber Tire -->
    <rect x="281" y="125" width="24" height="100" rx="6" fill="url(#tireGrad)" stroke="#6b7280" stroke-width="1.5"/>
    
    <!-- Right Velocity Arrow (Solid Vector Path) -->
    <g transform="translate(293, 120)">
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#22c55e" stroke-width="3.5"/>
      <polygon points="0,-58 -6,-43 6,-43" fill="#22c55e"/>
      <text x="0" y="-66" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">v<tspan font-size="10" baseline-shift="sub">R</tspan></text>
    </g>

    <!-- Arduino UNO Board on top -->
    <rect x="110" y="65" width="100" height="90" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="160" y="105" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Arduino UNO</text>
    <text x="160" y="125" fill="#93c5fd" font-size="10" text-anchor="middle">+ L293D Shield</text>

    <!-- Battery Pack (Over Axle) -->
    <rect x="110" y="200" width="100" height="45" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
    <text x="160" y="222" fill="#fdf2f8" font-size="10" font-weight="bold" text-anchor="middle">2S Battery Pack</text>
    <text x="160" y="236" fill="#fbcfe8" font-size="9" text-anchor="middle">(Mounted over axle)</text>

    <!-- Ball Caster (Rear Balance Wheel) -->
    <g transform="translate(160, 295)">
      <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#casterGrad)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="0" y="38" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">BALL CASTER</text>
      <text x="0" y="52" fill="#94a3b8" font-size="10" text-anchor="middle">(Passive Support / NO Motor)</text>
    </g>
  </g>

  <!-- RIGHT: Mathematical Formulas & Steering Dynamics -->
  <g transform="translate(460, 75)">
    <!-- Box 1: Kinematic Formulas (Subscript Fraction Architecture) -->
    <rect x="0" y="0" width="420" height="135" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="26" fill="#60a5fa" font-size="14" font-weight="bold">Kinematic Velocity Equations</text>
    
    <!-- Linear Velocity Fraction Group -->
    <g transform="translate(25, 38)">
      <!-- Label -->
      <text x="0" y="24" fill="#f8fafc" font-size="13" font-weight="bold">Linear Velocity (v)  =</text>
      <!-- Fraction -->
      <g transform="translate(155, 0)">
        <!-- Numerator with proper Subscripts vR + vL -->
        <text x="45" y="14" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">
          v<tspan font-size="10" baseline-shift="sub">R</tspan> + v<tspan font-size="10" baseline-shift="sub">L</tspan>
        </text>
        <!-- Fraction Bar -->
        <line x1="0" y1="20" x2="90" y2="20" stroke="#38bdf8" stroke-width="2"/>
        <!-- Denominator -->
        <text x="45" y="36" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      </g>
    </g>

    <!-- Angular Velocity Fraction Group -->
    <g transform="translate(25, 84)">
      <!-- Label -->
      <text x="0" y="24" fill="#f8fafc" font-size="13" font-weight="bold">Angular Velocity (ω)  =</text>
      <!-- Fraction -->
      <g transform="translate(165, 0)">
        <!-- Numerator with proper Subscripts vR − vL -->
        <text x="45" y="14" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">
          v<tspan font-size="10" baseline-shift="sub">R</tspan> − v<tspan font-size="10" baseline-shift="sub">L</tspan>
        </text>
        <!-- Fraction Bar -->
        <line x1="0" y1="20" x2="90" y2="20" stroke="#38bdf8" stroke-width="2"/>
        <!-- Denominator -->
        <text x="45" y="36" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">L</text>
      </g>
      <text x="270" y="24" fill="#94a3b8" font-size="12">(L = Track Width)</text>
    </g>

    <!-- Box 2: Differential Steering Table -->
    <rect x="0" y="150" width="420" height="195" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="174" fill="#34d399" font-size="14" font-weight="bold">Steering Motion Primitives</text>
    
    <g transform="translate(20, 202)" font-size="12" fill="#e2e8f0">
      <!-- Row 1: Forward -->
      <text x="0" y="0" fill="#fbbf24" font-weight="bold">Forward Drive:</text>
      <text x="145" y="0" fill="#38bdf8">v<tspan font-size="9" baseline-shift="sub">L</tspan> = +v,  v<tspan font-size="9" baseline-shift="sub">R</tspan> = +v</text>
      <text x="300" y="0" fill="#94a3b8">(ω = 0)</text>

      <!-- Row 2: Reverse -->
      <text x="0" y="25" fill="#fbbf24" font-weight="bold">Reverse Drive:</text>
      <text x="145" y="25" fill="#38bdf8">v<tspan font-size="9" baseline-shift="sub">L</tspan> = −v,  v<tspan font-size="9" baseline-shift="sub">R</tspan> = −v</text>
      <text x="300" y="25" fill="#94a3b8">(ω = 0)</text>

      <!-- Row 3: Pivot Left -->
      <text x="0" y="50" fill="#fbbf24" font-weight="bold">Pivot Left Turn:</text>
      <text x="145" y="50" fill="#38bdf8">v<tspan font-size="9" baseline-shift="sub">L</tspan> = 0,   v<tspan font-size="9" baseline-shift="sub">R</tspan> = +v</text>
      <text x="300" y="50" fill="#94a3b8">(Wide curve)</text>

      <!-- Row 4: Pivot Right -->
      <text x="0" y="75" fill="#fbbf24" font-weight="bold">Pivot Right Turn:</text>
      <text x="145" y="75" fill="#38bdf8">v<tspan font-size="9" baseline-shift="sub">L</tspan> = +v,  v<tspan font-size="9" baseline-shift="sub">R</tspan> = 0</text>
      <text x="300" y="75" fill="#94a3b8">(Wide curve)</text>

      <!-- Row 5: Point Spin Left -->
      <text x="0" y="100" fill="#fbbf24" font-weight="bold">Point Spin Left:</text>
      <text x="145" y="100" fill="#38bdf8">v<tspan font-size="9" baseline-shift="sub">L</tspan> = −v,  v<tspan font-size="9" baseline-shift="sub">R</tspan> = +v</text>
      <text x="300" y="100" fill="#94a3b8">(360° on spot)</text>

      <!-- Row 6: Point Spin Right -->
      <text x="0" y="125" fill="#fbbf24" font-weight="bold">Point Spin Right:</text>
      <text x="145" y="125" fill="#38bdf8">v<tspan font-size="9" baseline-shift="sub">L</tspan> = +v,  v<tspan font-size="9" baseline-shift="sub">R</tspan> = −v</text>
      <text x="300" y="125" fill="#94a3b8">(360° on spot)</text>
    </g>

    <!-- Box 3: Leveling Pro Tip -->
    <rect x="0" y="360" width="420" height="75" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="383" fill="#fbbf24" font-size="13" font-weight="bold">⚠ Leveling Rule for Extreme Beginners:</text>
    <text x="20" y="403" fill="#fde68a" font-size="11">Ensure both rubber drive wheels AND the ball caster</text>
    <text x="20" y="420" fill="#fde68a" font-size="11">firmly touch the table. If caster is too tall, tires slip!</text>
  </g>
</svg>
