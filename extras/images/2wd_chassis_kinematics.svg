<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="casterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="420" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">2-Wheel Differential Drive Robot — Kinematics &amp; Chassis Architecture</text>
  <text x="420" y="52" fill="#94a3b8" font-size="13" text-anchor="middle">Dual Yellow BO Motors with Passive Balance Ball Caster Wheel</text>

  <!-- LEFT SECTION: Chassis Diagram -->
  <g transform="translate(60, 80)">
    <!-- Chassis Body -->
    <rect x="70" y="40" width="180" height="260" rx="30" fill="url(#chassisGrad)" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3"/>
    <path d="M 70 80 Q 160 40 250 80" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="160" y="30" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">▲ FRONT (Sensor Side)</text>

    <!-- Arduino & Shield Area -->
    <rect x="95" y="100" width="130" height="100" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="160" y="145" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Arduino UNO</text>
    <text x="160" y="165" fill="#93c5fd" font-size="11" text-anchor="middle">+ L293D Shield</text>

    <!-- Left Motor & Wheel -->
    <!-- Motor Bracket -->
    <rect x="35" y="90" width="35" height="60" rx="4" fill="url(#motorGrad)" stroke="#b45309" stroke-width="1.5"/>
    <text x="52" y="125" fill="#78350f" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 52 125)">LEFT BO</text>
    <!-- Wheel -->
    <rect x="10" y="70" width="24" height="100" rx="6" fill="url(#tireGrad)" stroke="#6b7280" stroke-width="1.5"/>
    <!-- Velocity Arrow Left -->
    <line x1="22" y1="65" x2="22" y2="25" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="22" y="18" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">v_L</text>

    <!-- Right Motor & Wheel -->
    <!-- Motor Bracket -->
    <rect x="250" y="90" width="35" height="60" rx="4" fill="url(#motorGrad)" stroke="#b45309" stroke-width="1.5"/>
    <text x="268" y="125" fill="#78350f" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(90 268 125)">RIGHT BO</text>
    <!-- Wheel -->
    <rect x="286" y="70" width="24" height="100" rx="6" fill="url(#tireGrad)" stroke="#6b7280" stroke-width="1.5"/>
    <!-- Velocity Arrow Right -->
    <line x1="298" y1="65" x2="298" y2="25" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="298" y="18" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">v_R</text>

    <!-- Track Width Dimension L -->
    <line x1="22" y1="180" x2="298" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="22" cy="180" r="3" fill="#94a3b8"/>
    <circle cx="298" cy="180" r="3" fill="#94a3b8"/>
    <rect x="135" y="172" width="50" height="16" rx="3" fill="#0f172a"/>
    <text x="160" y="184" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">Track L</text>

    <!-- Battery Pack Placement (Center of Mass) -->
    <rect x="100" y="215" width="120" height="40" rx="6" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
    <text x="160" y="235" fill="#fdf2f8" font-size="11" font-weight="bold" text-anchor="middle">2x 18650 Battery Pack</text>
    <text x="160" y="248" fill="#fbcfe8" font-size="9" text-anchor="middle">(Mounted over drive axle)</text>

    <!-- Ball Caster Wheel (Passive Balance) -->
    <circle cx="160" cy="285" r="22" fill="url(#casterGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="160" cy="285" r="14" fill="#64748b"/>
    <circle cx="157" cy="282" r="4" fill="#f8fafc"/>
    <text x="160" y="325" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">BALL CASTER</text>
    <text x="160" y="340" fill="#94a3b8" font-size="10" text-anchor="middle">(Passive Support / NO Motor)</text>
  </g>

  <!-- RIGHT SECTION: Kinematic Formula & Steering Logic -->
  <g transform="translate(450, 75)">
    <!-- Box 1: Kinematic Formulas -->
    <rect x="0" y="0" width="340" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="25" fill="#60a5fa" font-size="13" font-weight="bold">Kinematic Velocity Equations</text>
    <text x="25" y="55" fill="#f8fafc" font-size="13">Linear Velocity:   <tspan fill="#38bdf8" font-weight="bold">v = (v_R + v_L) / 2</tspan></text>
    <text x="25" y="82" fill="#f8fafc" font-size="13">Angular Velocity:  <tspan fill="#38bdf8" font-weight="bold">ω = (v_R - v_L) / L</tspan></text>
    <text x="25" y="105" fill="#94a3b8" font-size="11">Where L = distance between Left and Right wheel contact points.</text>

    <!-- Box 2: Differential Steering Table -->
    <rect x="0" y="135" width="340" height="175" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="158" fill="#34d399" font-size="13" font-weight="bold">Steering Motion Primitives</text>
    
    <text x="20" y="185" fill="#e2e8f0" font-size="11"><tspan fill="#fbbf24" font-weight="bold">Forward Drive:</tspan>  v_L = +v,  v_R = +v  (ω = 0)</text>
    <text x="20" y="208" fill="#e2e8f0" font-size="11"><tspan fill="#fbbf24" font-weight="bold">Reverse Drive:</tspan>  v_L = -v,  v_R = -v  (ω = 0)</text>
    <text x="20" y="231" fill="#e2e8f0" font-size="11"><tspan fill="#fbbf24" font-weight="bold">Pivot Left:</tspan>      v_L = 0,   v_R = +v  (Wide curve)</text>
    <text x="20" y="254" fill="#e2e8f0" font-size="11"><tspan fill="#fbbf24" font-weight="bold">Pivot Right:</tspan>     v_L = +v,  v_R = 0   (Wide curve)</text>
    <text x="20" y="277" fill="#e2e8f0" font-size="11"><tspan fill="#fbbf24" font-weight="bold">Point Spin Left:</tspan> v_L = -v,  v_R = +v  (360° on spot)</text>
    <text x="20" y="300" fill="#e2e8f0" font-size="11"><tspan fill="#fbbf24" font-weight="bold">Point Spin Right:</tspan>v_L = +v,  v_R = -v  (360° on spot)</text>

    <!-- Box 3: Leveling Pro Tip -->
    <rect x="0" y="325" width="340" height="75" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="348" fill="#fbbf24" font-size="12" font-weight="bold">⚠ Leveling Rule for Extreme Beginners:</text>
    <text x="15" y="368" fill="#fde68a" font-size="11">Ensure both rubber drive wheels AND the ball caster</text>
    <text x="15" y="385" fill="#fde68a" font-size="11">firmly touch the table. If caster is too tall, tires slip!</text>
  </g>
</svg>
